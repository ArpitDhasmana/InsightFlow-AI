<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InsightFlow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --bg-2: #151b24;
    --card: #171e28;
    --line: #28323f;
    --ink: #e7ecf3;
    --ink-soft: #8a97a8;
    --accent: #2dd4bf;
    --accent-2: #5eead4;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.38);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  nav {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 40px;
    max-width: 1160px;
    margin: 0 auto;
  }
  .brand { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav .links { display: flex; gap: 26px; margin-left: 30px; color: var(--ink-soft); font-size: 15px; }
  nav .links a { text-decoration: none; transition: color .15s ease-out; }
  nav .links a:hover { color: var(--ink); }

  .hero {
    max-width: 1160px;
    margin: 0 auto;
    padding: 60px 40px 30px;
    text-align: center;
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 82px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0 auto;
    max-width: 14ch;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    color: var(--ink-soft);
    font-size: 18px;
    max-width: 52ch;
    margin: 22px auto 0;
  }

  .ask-wrap { max-width: 720px; margin: 36px auto 0; padding: 0 40px; }
  .ask {
    display: flex;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 8px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .ask input {
    flex: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 16px;
    padding: 12px 18px;
    color: var(--ink);
    outline: none;
  }
  .ask input::placeholder { color: var(--ink-soft); }
  .ask button {
    border: none;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    padding: 0 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease-out, background .15s ease-out;
  }
  .ask button:hover { background: #34e0cc; }
  .ask button:active { transform: scale(.97); }
  .ask button:disabled { opacity: .55; cursor: default; }

  .samples { max-width: 720px; margin: 16px auto 0; padding: 0 40px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .samples button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .15s ease-out, border-color .15s ease-out;
  }
  .samples button:hover { color: var(--accent-2); border-color: var(--accent); }

  main { max-width: 1160px; margin: 0 auto; padding: 40px 40px 80px; }
  #results { display: grid; gap: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: start; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 28px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise .3s ease-out forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { animation: fade .3s ease-out forwards; transform: none; }
    @keyframes fade { to { opacity: 1; } }
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--accent-2);
    font-weight: 600;
  }
  .summary {
    font-family: "Fraunces", Georgia, serif;
    font-size: 24px;
    line-height: 1.4;
    font-weight: 400;
  }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi {
    padding: 16px 18px;
    background: rgba(45,212,191,.05);
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: transform .15s ease-out, border-color .15s ease-out, background .15s ease-out;
  }
  .kpi .label { font-size: 12px; color: var(--ink-soft); letter-spacing: .02em; }
  .kpi .value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -.02em;
    margin-top: 6px;
    line-height: 1;
    white-space: nowrap;
  }
  .kpi .value.neg { color: var(--accent-2); }
  .kpi .kpi-hint { margin-top: 10px; font-size: 11px; color: var(--accent-2); opacity: 0; transition: opacity .15s ease-out; }
  .kpi.interactive { cursor: pointer; }
  .kpi.interactive:hover { transform: translateY(-3px); border-color: var(--accent); background: rgba(45,212,191,.10); }
  .kpi.interactive:hover .kpi-hint, .kpi.active .kpi-hint { opacity: 1; }
  .kpi.active { border-color: var(--accent); background: rgba(45,212,191,.14); }

  ul.recs { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  ul.recs li { padding-left: 30px; position: relative; color: var(--ink); }
  ul.recs li::before {
    content: "";
    position: absolute; left: 0; top: 9px;
    width: 14px; height: 2px; background: var(--accent);
  }

  pre.sql {
    margin: 0; background: #1c0c08; color: #e7d6c8; padding: 18px;
    border-radius: 12px; overflow-x: auto; font-size: 13px; line-height: 1.6;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; border: 1px solid var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; }
  th {
    color: var(--ink-soft); font-weight: 500; border-bottom: 1px solid var(--line);
    text-transform: capitalize; cursor: pointer; user-select: none; white-space: nowrap;
    transition: color .15s ease-out;
  }
  th:hover { color: var(--ink); }
  th .sort { color: var(--accent); }
  td { border-bottom: 1px solid rgba(40,50,63,.6); }
  td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hl td { background: rgba(45,212,191,.12); }

  .table-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .tbl-filter {
    flex: 0 0 220px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; color: var(--ink); font: inherit; font-size: 14px; outline: none;
    transition: border-color .15s ease-out;
  }
  .tbl-filter:focus { border-color: var(--accent); }
  .tbl-count { color: var(--ink-soft); font-size: 13px; margin-left: auto; }
  .table-scroll { overflow-x: auto; }
  .pager { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 16px; }
  .pager button {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; font-size: 16px; line-height: 1;
    transition: border-color .15s ease-out, color .15s ease-out;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pg-info { color: var(--ink-soft); font-size: 13px; min-width: 60px; text-align: center; }
  .chart-box { position: relative; height: 300px; }

  .empty, .error { color: var(--ink-soft); text-align: center; padding: 30px; }
  .error { color: #f0918f; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<nav>
  <div class="brand">Insight<span>Flow</span></div>
  <div class="links">
    <a href="#ask">Ask</a>
    <a href="#results">Insights</a>
  </div>
</nav>

<header class="hero">
  <h1>Together, we turn data into <em>decisions.</em></h1>
  <p>InsightFlow AI writes the analysis, forecast, and executive recommendation — from a single plain-English question.</p>
</header>

<section id="ask" class="ask-wrap">
  <div class="ask">
    <input id="q" placeholder="Ask a business question…" autocomplete="off" />
    <button id="go">Ask</button>
  </div>
</section>
<div class="samples" id="samples"></div>

<main>
  <div id="results">
    <div class="empty">Ask a question to generate an executive briefing.</div>
  </div>
</main>

<script>
Chart.defaults.color = "#8a97a8";
Chart.defaults.font.family = "'Space Grotesk', sans-serif";
Chart.defaults.borderColor = "rgba(231,236,243,.06)";

// API base: empty = same origin (works with the Netlify proxy). Set
// window.__API_BASE__ to the Render URL to call the backend directly instead.
const API_BASE = (window.__API_BASE__ || "").replace(/\/$/, "");

const SAMPLES = [
  "Monthly revenue trend and forecast",
  "Revenue by region",
  "Daily revenue in January 2026",
  "Profit margin by brand",
  "Which weekday has the most sales?",
  "Yearly revenue",
  "Top 5 products this year",
  "Revenue by customer segment last quarter",
];
const samplesEl = document.getElementById("samples");
SAMPLES.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { document.getElementById("q").value = s; ask(); };
  samplesEl.appendChild(b);
});

const input = document.getElementById("q");
const goBtn = document.getElementById("go");
goBtn.onclick = ask;
input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

let charts = [];
let dataFilterApi = null;
let highlightRow = null;
const WARM = ["#2dd4bf", "#60a5fa", "#a78bfa", "#f472b6", "#fbbf24", "#4ade80", "#22d3ee", "#fb7185"];
function fmt(n) {
  if (typeof n !== "number") return n;
  return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
}
function fmtCompact(n) {
  if (typeof n !== "number") return n;
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  goBtn.disabled = true;
  goBtn.innerHTML = '<span class="spinner"></span>';
  const results = document.getElementById("results");
  results.innerHTML = '<div class="empty">Analyzing…</div>';
  try {
    const res = await fetch(API_BASE + "/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || res.statusText);
    }
    render(await res.json());
    document.getElementById("results").scrollIntoView({ block: "start" });
  } catch (e) {
    results.innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = "Ask";
  }
}

function card(title, bodyHtml, delay, cls) {
  const d = document.createElement("div");
  d.className = "card" + (cls ? " " + cls : "");
  d.style.animationDelay = (delay || 0) + "ms";
  d.innerHTML = (title ? `<h2>${title}</h2>` : "") + bodyHtml;
  return d;
}

function chartCanvas(spec, delay) {
  const c = card(spec.title, '<div class="chart-box"><canvas></canvas></div>', delay);
  const ctx = c.querySelector("canvas");
  const isLine = spec.type === "line";
  const isHbar = spec.type === "hbar";
  const isPie = spec.type === "doughnut" || spec.type === "pie";
  const valTicks = { callback: v => fmt(v), color: "#8a97a8" };

  let scales = {};
  if (!isPie) {
    scales = isHbar
      ? { x: { beginAtZero: true, grid: { color: "rgba(231,236,243,.06)" }, ticks: valTicks }, y: { grid: { display: false } } }
      : { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: "rgba(231,236,243,.06)" }, ticks: valTicks } };
  }

  charts.push(new Chart(ctx, {
    type: isLine ? "line" : (isPie ? "doughnut" : "bar"),
    data: {
      labels: spec.labels,
      datasets: spec.series.map((s) => {
        if (isPie) {
          return {
            label: s.name,
            data: s.data,
            backgroundColor: spec.labels.map((_, i) => WARM[i % WARM.length]),
            borderColor: "#171e28",
            borderWidth: 2,
          };
        }
        return {
          label: s.name,
          data: s.data,
          borderColor: s.name === "forecast" ? "#5eead4" : (isLine ? "#cdd8e6" : "#2dd4bf"),
          backgroundColor: isLine ? "transparent" : "#2dd4bf",
          borderDash: s.name === "forecast" ? [6, 5] : [],
          borderWidth: 2,
          pointRadius: isLine ? 0 : undefined,
          pointHoverRadius: 4,
          tension: 0.4,
          spanGaps: true,
          borderRadius: isLine ? 0 : 6,
          maxBarThickness: 46,
        };
      }),
    },
    options: {
      indexAxis: isHbar ? "y" : "x",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: isPie || spec.series.length > 1,
          position: isPie ? "right" : "top",
          labels: { boxWidth: 12, boxHeight: 12 },
        },
      },
      scales,
    },
  }));
  return c;
}

function buildDataCard(rows, delay) {
  const cols = Object.keys(rows[0]);
  const labelKey = cols.find(c => typeof rows[0][c] === "string");
  const valueKey = cols.find(c => typeof rows[0][c] === "number");
  const state = { filter: "", sortCol: valueKey || cols[0], sortDir: "desc", page: 0, pageSize: 8 };

  const c = card("Data",
    '<div class="table-toolbar">' +
      '<input class="tbl-filter" type="text" placeholder="Filter rows…" />' +
      '<span class="tbl-count"></span>' +
    '</div>' +
    '<div class="table-scroll"><table><thead></thead><tbody></tbody></table></div>' +
    '<div class="pager"><button class="pg-prev" aria-label="Previous page">‹</button>' +
      '<span class="pg-info"></span>' +
      '<button class="pg-next" aria-label="Next page">›</button></div>', delay);

  const filterEl = c.querySelector(".tbl-filter");
  const countEl = c.querySelector(".tbl-count");
  const thead = c.querySelector("thead");
  const tbody = c.querySelector("tbody");
  const info = c.querySelector(".pg-info");
  const prev = c.querySelector(".pg-prev");
  const nextBtn = c.querySelector(".pg-next");

  thead.innerHTML = "<tr>" + cols.map(col => `<th data-col="${col}">${col}<span class="sort"></span></th>`).join("") + "</tr>";

  function view() {
    let r = rows;
    if (state.filter) {
      const f = state.filter.toLowerCase();
      r = r.filter(row => cols.some(col => String(row[col]).toLowerCase().includes(f)));
    }
    return [...r].sort((a, b) => {
      const av = a[state.sortCol], bv = b[state.sortCol];
      const cmp = (typeof av === "number" && typeof bv === "number") ? av - bv : String(av).localeCompare(String(bv));
      return state.sortDir === "asc" ? cmp : -cmp;
    });
  }

  function renderBody() {
    const r = view();
    const pages = Math.max(1, Math.ceil(r.length / state.pageSize));
    if (state.page >= pages) state.page = pages - 1;
    const start = state.page * state.pageSize;
    const slice = r.slice(start, start + state.pageSize);
    tbody.innerHTML = slice.length
      ? slice.map(row => `<tr${row[labelKey] === highlightRow ? ' class="hl"' : ""}>` +
          cols.map(col => `<td>${typeof row[col] === "number" ? fmt(row[col]) : row[col]}</td>`).join("") + "</tr>").join("")
      : `<tr><td colspan="${cols.length}" class="empty">No matching rows</td></tr>`;
    countEl.textContent = `${r.length} row${r.length !== 1 ? "s" : ""}`;
    info.textContent = `${state.page + 1} / ${pages}`;
    prev.disabled = state.page === 0;
    nextBtn.disabled = state.page >= pages - 1;
    thead.querySelectorAll("th").forEach(th => {
      th.querySelector(".sort").textContent = th.dataset.col === state.sortCol ? (state.sortDir === "asc" ? " ↑" : " ↓") : "";
    });
  }

  filterEl.addEventListener("input", () => { state.filter = filterEl.value; state.page = 0; renderBody(); });
  prev.onclick = () => { if (state.page > 0) { state.page--; renderBody(); } };
  nextBtn.onclick = () => { state.page++; renderBody(); };
  thead.querySelectorAll("th").forEach(th => th.onclick = () => {
    const col = th.dataset.col;
    if (state.sortCol === col) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    else { state.sortCol = col; state.sortDir = "desc"; }
    state.page = 0;
    renderBody();
  });

  dataFilterApi = { setFilter: (v) => { state.filter = v; filterEl.value = v; state.page = 0; renderBody(); } };
  renderBody();
  return c;
}

function render(data) {
  charts.forEach(c => c.destroy());
  charts = [];
  dataFilterApi = null;
  highlightRow = null;
  const results = document.getElementById("results");
  results.innerHTML = "";
  let step = 0;
  const next = () => (step++ * 60);

  results.appendChild(card("Executive Summary", `<div class="summary">${data.executive_summary}</div>`, next()));

  const k = data.kpis || {};
  const isPct = k.metric === "margin";
  const kval = (v) => (isPct ? Number(v).toFixed(1) + "%" : fmtCompact(v));
  const kfull = (v) => (isPct ? Number(v).toFixed(2) + "%" : fmt(v));
  const tiles = [];
  if (k.total !== undefined) tiles.push({ label: "Total " + (k.metric || ""), value: kval(k.total), full: kfull(k.total) });
  if (k.top) tiles.push({ label: "Top · " + k.top.name, value: kval(k.top.value), full: kfull(k.top.value), target: k.top.name });
  if (k.bottom) tiles.push({ label: "Lowest · " + k.bottom.name, value: kval(k.bottom.value), full: kfull(k.bottom.value), target: k.bottom.name });
  if (k.average !== undefined) tiles.push({ label: isPct ? "Average margin" : "Average", value: kval(k.average), full: kfull(k.average) });
  if (k.period_growth_pct !== undefined) tiles.push({ label: "Period Growth", value: k.period_growth_pct + "%", neg: k.period_growth_pct < 0 });
  if (data.forecast && data.forecast.available) tiles.push({ label: "Forecast · next", value: kval(data.forecast.next_value), full: kfull(data.forecast.next_value) });

  if (tiles.length) {
    const strip = card("Key Metrics", '<div class="kpis"></div>', next());
    const grid = strip.querySelector(".kpis");
    tiles.forEach(t => {
      const tile = document.createElement("div");
      tile.className = "kpi" + (t.target ? " interactive" : "");
      tile.innerHTML = `<div class="label">${t.label}</div>` +
        `<div class="value${t.neg ? " neg" : ""}"${t.full ? ` title="${t.full}"` : ""}>${t.value}</div>` +
        (t.target ? '<div class="kpi-hint">Filter data →</div>' : "");
      if (t.target) tile.onclick = () => {
        grid.querySelectorAll(".kpi").forEach(x => x.classList.remove("active"));
        tile.classList.add("active");
        highlightRow = t.target;
        if (dataFilterApi) dataFilterApi.setFilter(t.target);
        document.querySelector(".table-scroll")?.closest(".card")?.scrollIntoView({ block: "center", behavior: "smooth" });
      };
      grid.appendChild(tile);
    });
    results.appendChild(strip);
  }

  if (data.recommendations && data.recommendations.length) {
    const html = '<ul class="recs">' + data.recommendations.map(r => `<li>${r}</li>`).join("") + "</ul>";
    results.appendChild(card("Recommendations", html, next()));
  }

  (data.charts || []).forEach(spec => {
    if (spec.type === "kpi") return;
    results.appendChild(chartCanvas(spec, next()));
  });

  if (data.rows && data.rows.length) {
    results.appendChild(buildDataCard(data.rows, next()));
  }
}
</script>
</body>
</html>
