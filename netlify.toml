# Netlify config for the InsightFlow AI frontend (static site).
# Publishes the frontend/ folder and proxies API calls to the Render backend so
# the browser stays same-origin (no CORS needed).

[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://insightflow-api-l7ju.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://insightflow-api-l7ju.onrender.com/health"
  status = 200
  force = true
