# Netlify config for the InsightFlow AI frontend (static site).
# base = frontend so Netlify never sees the backend's requirements.txt and skips
# any Python build; the API is proxied to the Render backend (same-origin).

[build]
  base = "frontend"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://insightflow-api-l7ju.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://insightflow-api-l7ju.onrender.com/health"
  status = 200
  force = true
