# Netlify config for the InsightFlow AI frontend (static site).
# Publishes the frontend/ folder and proxies API calls to the Render backend so
# the browser stays same-origin (no CORS needed).
#
# IMPORTANT: replace INSIGHTFLOW_API_URL below with your Render URL, e.g.
#   https://insightflow-api.onrender.com

[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://INSIGHTFLOW_API_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://INSIGHTFLOW_API_URL/health"
  status = 200
  force = true
