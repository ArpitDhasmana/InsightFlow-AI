<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InsightFlow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #26110d;
    --bg-2: #2f1712;
    --card: #351b13;
    --line: #4d2c21;
    --ink: #f4e9dd;
    --ink-soft: #bfa393;
    --accent: #e8623a;
    --accent-2: #f0a074;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 18px 40px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  nav {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 40px;
    max-width: 1160px;
    margin: 0 auto;
  }
  .brand { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav .links { display: flex; gap: 26px; margin-left: 30px; color: var(--ink-soft); font-size: 15px; }
  nav .links a { text-decoration: none; transition: color .15s ease-out; }
  nav .links a:hover { color: var(--ink); }
  .mode {
    margin-left: auto;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--accent-2);
    background: rgba(232,98,58,.08);
  }

  .hero {
    max-width: 1160px;
    margin: 0 auto;
    padding: 60px 40px 30px;
    text-align: center;
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 82px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0 auto;
    max-width: 14ch;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p {
    color: var(--ink-soft);
    font-size: 18px;
    max-width: 52ch;
    margin: 22px auto 0;
  }

  .ask-wrap { max-width: 720px; margin: 36px auto 0; padding: 0 40px; }
  .ask {
    display: flex;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 8px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .ask input {
    flex: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 16px;
    padding: 12px 18px;
    color: var(--ink);
    outline: none;
  }
  .ask input::placeholder { color: var(--ink-soft); }
  .ask button {
    border: none;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    padding: 0 26px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease-out, background .15s ease-out;
  }
  .ask button:hover { background: #f06f47; }
  .ask button:active { transform: scale(.97); }
  .ask button:disabled { opacity: .55; cursor: default; }

  .samples { max-width: 720px; margin: 16px auto 0; padding: 0 40px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .samples button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .15s ease-out, border-color .15s ease-out;
  }
  .samples button:hover { color: var(--accent-2); border-color: var(--accent); }

  main { max-width: 1160px; margin: 0 auto; padding: 40px 40px 80px; }
  #results { display: grid; gap: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: start; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 28px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise .3s ease-out forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { animation: fade .3s ease-out forwards; transform: none; }
    @keyframes fade { to { opacity: 1; } }
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--accent-2);
    font-weight: 600;
  }
  .summary {
    font-family: "Fraunces", Georgia, serif;
    font-size: 24px;
    line-height: 1.4;
    font-weight: 400;
  }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
  .kpi { padding: 20px; background: var(--card); }
  .kpi .label { font-size: 12px; color: var(--ink-soft); letter-spacing: .02em; }
  .kpi .value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -.02em;
    margin-top: 6px;
    line-height: 1;
  }
  .kpi .value.neg { color: var(--accent-2); }

  ul.recs { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  ul.recs li { padding-left: 30px; position: relative; color: var(--ink); }
  ul.recs li::before {
    content: "";
    position: absolute; left: 0; top: 9px;
    width: 14px; height: 2px; background: var(--accent);
  }

  pre.sql {
    margin: 0; background: #1c0c08; color: #e7d6c8; padding: 18px;
    border-radius: 12px; overflow-x: auto; font-size: 13px; line-height: 1.6;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; border: 1px solid var(--line);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; }
  th { color: var(--ink-soft); font-weight: 500; border-bottom: 1px solid var(--line); text-transform: capitalize; }
  td { border-bottom: 1px solid rgba(77,44,33,.5); }
  td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  .empty, .error { color: var(--ink-soft); text-align: center; padding: 30px; }
  .error { color: #f0916a; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<nav>
  <div class="brand">Insight<span>Flow</span></div>
  <div class="links">
    <a href="#ask">Ask</a>
    <a href="#results">Insights</a>
  </div>
  <span class="mode" id="mode">checking…</span>
</nav>

<header class="hero">
  <h1>Together, we turn data into <em>decisions.</em></h1>
  <p>InsightFlow AI writes the analysis, forecast, and executive recommendation — from a single plain-English question.</p>
</header>

<section id="ask" class="ask-wrap">
  <div class="ask">
    <input id="q" placeholder="Ask a business question…" autocomplete="off" />
    <button id="go">Ask</button>
  </div>
</section>
<div class="samples" id="samples"></div>

<main>
  <div id="results">
    <div class="empty">Ask a question to generate an executive briefing.</div>
  </div>
</main>

<script>
Chart.defaults.color = "#bfa393";
Chart.defaults.font.family = "'Space Grotesk', sans-serif";
Chart.defaults.borderColor = "rgba(244,233,221,.07)";

const SAMPLES = [
  "Show me the monthly revenue trend and forecast",
  "What is our profit by region?",
  "Which product categories perform best?",
  "Revenue by customer segment last quarter",
  "Top products by revenue this year",
];
const samplesEl = document.getElementById("samples");
SAMPLES.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { document.getElementById("q").value = s; ask(); };
  samplesEl.appendChild(b);
});

fetch("/health").then(r => r.json()).then(h => {
  const m = document.getElementById("mode");
  m.textContent = h.llm_powered ? "LLM-powered" : "Heuristic mode";
  if (!h.seeded) m.textContent = "DB not seeded";
});

const input = document.getElementById("q");
const goBtn = document.getElementById("go");
goBtn.onclick = ask;
input.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

let charts = [];
function fmt(n) {
  if (typeof n !== "number") return n;
  return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  goBtn.disabled = true;
  goBtn.innerHTML = '<span class="spinner"></span>';
  const results = document.getElementById("results");
  results.innerHTML = '<div class="empty">Analyzing…</div>';
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || res.statusText);
    }
    render(await res.json());
    document.getElementById("results").scrollIntoView({ block: "start" });
  } catch (e) {
    results.innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = "Ask";
  }
}

function card(title, bodyHtml, delay, cls) {
  const d = document.createElement("div");
  d.className = "card" + (cls ? " " + cls : "");
  d.style.animationDelay = (delay || 0) + "ms";
  d.innerHTML = (title ? `<h2>${title}</h2>` : "") + bodyHtml;
  return d;
}

function chartCanvas(spec, delay) {
  const c = card(spec.title, "<canvas></canvas>", delay);
  const ctx = c.querySelector("canvas");
  charts.push(new Chart(ctx, {
    type: spec.type === "line" ? "line" : "bar",
    data: {
      labels: spec.labels,
      datasets: spec.series.map((s) => {
        const cream = "#f0d9c6";
        const primary = spec.type === "line";
        return {
          label: s.name,
          data: s.data,
          borderColor: s.name === "forecast" ? "#f0a074" : (primary ? cream : "#e8623a"),
          backgroundColor: primary ? "transparent" : "#e8623a",
          borderDash: s.name === "forecast" ? [6, 5] : [],
          borderWidth: 2,
          pointRadius: primary ? 0 : undefined,
          pointHoverRadius: 4,
          tension: 0.4,
          spanGaps: true,
          borderRadius: primary ? 0 : 6,
          maxBarThickness: 46,
        };
      }),
    },
    options: {
      responsive: true,
      plugins: { legend: { display: spec.series.length > 1, labels: { boxWidth: 12, boxHeight: 12 } } },
      scales: {
        y: { beginAtZero: true, grid: { color: "rgba(244,233,221,.06)" }, ticks: { callback: v => fmt(v) } },
        x: { grid: { display: false } },
      },
    },
  }));
  return c;
}

function render(data) {
  charts.forEach(c => c.destroy());
  charts = [];
  const results = document.getElementById("results");
  results.innerHTML = "";
  let step = 0;
  const next = () => (step++ * 60);

  results.appendChild(card("Executive Summary", `<div class="summary">${data.executive_summary}</div>`, next()));

  const k = data.kpis || {};
  const cards = [];
  if (k.total !== undefined) cards.push(["Total " + (k.metric || ""), fmt(k.total), false]);
  if (k.top) cards.push(["Top · " + k.top.name, fmt(k.top.value), false]);
  if (k.average !== undefined) cards.push(["Average", fmt(k.average), false]);
  if (k.period_growth_pct !== undefined) cards.push(["Period Growth", k.period_growth_pct + "%", k.period_growth_pct < 0]);
  if (data.forecast && data.forecast.available) cards.push(["Forecast · next", fmt(data.forecast.next_value), false]);

  const grid = document.createElement("div");
  grid.className = "grid-2";
  if (cards.length) {
    const html = '<div class="kpis">' + cards.map(([l, v, neg]) =>
      `<div class="kpi"><div class="label">${l}</div><div class="value${neg ? " neg" : ""}">${v}</div></div>`).join("") + "</div>";
    grid.appendChild(card("Key Metrics", html, next()));
  }
  if (data.recommendations && data.recommendations.length) {
    const html = '<ul class="recs">' + data.recommendations.map(r => `<li>${r}</li>`).join("") + "</ul>";
    grid.appendChild(card("Recommendations", html, next()));
  }
  if (grid.children.length) results.appendChild(grid);

  (data.charts || []).forEach(spec => {
    if (spec.type === "kpi") return;
    results.appendChild(chartCanvas(spec, next()));
  });

  if (data.rows && data.rows.length) {
    const cols = Object.keys(data.rows[0]);
    const head = "<tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";
    const body = data.rows.slice(0, 12).map(r =>
      "<tr>" + cols.map(c => `<td>${typeof r[c] === "number" ? fmt(r[c]) : r[c]}</td>`).join("") + "</tr>").join("");
    results.appendChild(card("Data", `<table>${head}${body}</table>`, next()));
  }

  results.appendChild(card("Generated SQL", `<pre class="sql">${data.sql}</pre>`, next()));
}
</script>
</body>
</html>
